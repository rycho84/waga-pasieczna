[platformio]
default_envs = waga

; ─────────────────────────────────────────────────────────
; WAGA — FireBeetle 2 ESP32-C6  (nowy, domyślny)
; ─────────────────────────────────────────────────────────
[env:waga]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board         = dfrobot_firebeetle2_esp32c6
framework     = arduino
monitor_speed = 115200
upload_port   = COM5
monitor_port  = COM5
build_src_filter = -<*> +<waga.cpp>
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bogde/HX711
extra_scripts = scripts/upload_monitor.py
upload_flags = --after=monitor
; ─────────────────────────────────────────────────────────
; WAGA — Wemos ESP32 / klasyczny ESP32  (stara płytka)
; ─────────────────────────────────────────────────────────
[env:waga_wemos]
platform      = espressif32@6.7.0
board         = wemos_d1_mini32
framework     = arduino
monitor_speed = 115200
upload_port   = COM3          ; ← zmień na właściwy port
monitor_port  = COM3          ; ← zmień na właściwy port
build_src_filter = -<*> +<waga.cpp>
build_flags =
    -D BOARD_ESP32_CLASSIC    ; włącza stare sygnatury callbacków ESP-NOW
lib_deps =
    bogde/HX711
    monitor_encoding = UTF-8

monitor_flags =
    --encoding
    utf8
    monitor_filters = direct
; ─────────────────────────────────────────────────────────
; CENTRALA — TTGO T-Call (ESP32 + SIM800)
; ─────────────────────────────────────────────────────────
[env:centrala]
platform      = espressif32@6.7.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_port   = COM4
monitor_port  = COM4
build_src_filter = -<*> +<centrala.cpp>
lib_deps =
    vshymanskyy/TinyGSM
    adafruit/RTClib
    SPI
    WiFi

lib_ldf_mode = deep+